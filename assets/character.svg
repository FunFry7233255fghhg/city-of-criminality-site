<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 84" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e0f13"/>
      <stop offset="55%" stop-color="#1a1c22"/>
      <stop offset="100%" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="cc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f0ea"/>
      <stop offset="100%" stop-color="#e2662a"/>
    </linearGradient>
  </defs>

  <!-- тень -->
  <ellipse cx="22" cy="80" rx="16" ry="3.5" fill="#000" opacity="0.45"/>

  <!-- НОГИ -->
  <rect x="14" y="52" width="7" height="24" fill="#141821"/>
  <rect x="23" y="52" width="7" height="24" fill="#10131b"/>
  <!-- ботинки -->
  <rect x="14" y="72" width="7" height="7" fill="#08090c"/>
  <rect x="23" y="72" width="7" height="7" fill="#07080b"/>

  <!-- РУКИ -->
  <rect x="7" y="30" width="7" height="24" fill="#121419"/>
  <rect x="30" y="30" width="7" height="24" fill="#0d0f13"/>
  <!-- кисти -->
  <rect x="7" y="50" width="7" height="6" fill="#c98e63"/>
  <rect x="30" y="50" width="7" height="6" fill="#b87f57"/>

  <!-- ТУЛОВИЩ (худи) -->
  <rect x="13" y="30" width="18" height="24" fill="url(#hoodie)"/>
  <rect x="13" y="30" width="18" height="3" fill="#22252d"/>
  <!-- капюшон сзади -->
  <rect x="15" y="26" width="14" height="6" fill="#1d2027"/>
  <rect x="17" y="27" width="10" height="3" fill="#16181e"/>

  <!-- надпись CC на спине -->
  <g fill="url(#cc)">
    <!-- C -->
    <rect x="15" y="37" width="6" height="2"/>
    <rect x="15" y="37" width="2" height="10"/>
    <rect x="15" y="45" width="6" height="2"/>
    <!-- C -->
    <rect x="23" y="37" width="6" height="2"/>
    <rect x="23" y="37" width="2" height="10"/>
    <rect x="23" y="45" width="6" height="2"/>
  </g>

  <!-- ГОЛОВА (вид сзади: волосы) -->
  <rect x="13" y="8" width="18" height="18" fill="#14161c"/>
  <rect x="13" y="8" width="18" height="6" fill="#0d0e12"/>
  <rect x="13" y="14" width="3" height="12" fill="#101218"/>
  <rect x="28" y="14" width="3" height="12" fill="#0b0c10"/>
  <rect x="16" y="16" width="12" height="2" fill="#1b1e26"/>
  <!-- уши/наушники -->
  <rect x="10" y="15" width="3" height="6" fill="#0a0b0e"/>
  <rect x="31" y="15" width="3" height="6" fill="#0a0b0e"/>
  <rect x="10" y="15" width="3" height="2" fill="#e2662a"/>
  <rect x="31" y="15" width="3" height="2" fill="#e2662a"/>
  <!-- шея -->
  <rect x="18" y="24" width="8" height="4" fill="#a9764f"/>
</svg>
