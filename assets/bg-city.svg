<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="35%" stop-color="#1a1210"/>
      <stop offset="60%" stop-color="#4a2413"/>
      <stop offset="78%" stop-color="#a8481a"/>
      <stop offset="92%" stop-color="#e0762c"/>
      <stop offset="100%" stop-color="#f59a45"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#ff9a3c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1d10"/>
      <stop offset="45%" stop-color="#22130c"/>
      <stop offset="100%" stop-color="#120a07"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9440" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9440" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a16"/>
      <stop offset="100%" stop-color="#170f0b"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b120d"/>
      <stop offset="100%" stop-color="#100a07"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0906"/>
      <stop offset="100%" stop-color="#070403"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a30" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff8a30" stop-opacity="0"/>
    </linearGradient>

    <!-- узор окон -->
    <pattern id="winA" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="4" height="5" fill="#ffb26b" opacity="0.75"/>
      <rect x="9" y="11" width="4" height="5" fill="#ffcf9a" opacity="0.5"/>
    </pattern>
    <pattern id="winB" width="18" height="22" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="5" height="6" fill="#ffa857" opacity="0.55"/>
      <rect x="11" y="14" width="5" height="6" fill="#ffd7a8" opacity="0.35"/>
    </pattern>
    <pattern id="winC" width="22" height="26" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="6" height="7" fill="#ffb773" opacity="0.4"/>
      <rect x="14" y="17" width="6" height="7" fill="#ffdcb0" opacity="0.22"/>
    </pattern>

    <filter id="blur60"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- НЕБО -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- солнце у горизонта -->
  <circle cx="1170" cy="705" r="260" fill="url(#sunGlow)"/>
  <circle cx="1170" cy="705" r="58" fill="#ffd9a5" opacity="0.9" filter="url(#blur18)"/>

  <!-- световые лучи -->
  <polygon points="1170,705 1620,0 1920,0 1920,320" fill="url(#ray)"/>
  <polygon points="1170,705 900,0 620,0 1060,705" fill="url(#ray)"/>

  <!-- дальний скайлайн -->
  <g fill="url(#far)">
    <rect x="-20" y="560" width="120" height="260"/>
    <rect x="120" y="610" width="90" height="210"/>
    <rect x="230" y="530" width="140" height="290"/>
    <rect x="390" y="600" width="100" height="220"/>
    <rect x="510" y="500" width="120" height="320"/>
    <rect x="650" y="575" width="95" height="245"/>
    <rect x="765" y="450" width="130" height="370"/>
    <rect x="915" y="545" width="105" height="275"/>
    <rect x="1040" y="420" width="150" height="400"/>
    <rect x="1210" y="520" width="110" height="300"/>
    <rect x="1340" y="470" width="135" height="350"/>
    <rect x="1495" y="560" width="100" height="260"/>
    <rect x="1615" y="500" width="140" height="320"/>
    <rect x="1775" y="580" width="165" height="240"/>
    <!-- шпили -->
    <rect x="285" y="470" width="12" height="70"/>
    <rect x="820" y="380" width="14" height="80"/>
    <rect x="1105" y="350" width="16" height="80"/>
    <rect x="1395" y="400" width="13" height="80"/>
  </g>
  <g fill="url(#winB)" opacity="0.9">
    <rect x="230" y="530" width="140" height="290"/>
    <rect x="510" y="500" width="120" height="320"/>
    <rect x="765" y="450" width="130" height="370"/>
    <rect x="1040" y="420" width="150" height="400"/>
    <rect x="1340" y="470" width="135" height="350"/>
    <rect x="1615" y="500" width="140" height="320"/>
  </g>

  <!-- средний план -->
  <g fill="url(#mid)">
    <rect x="-20" y="640" width="160" height="190"/>
    <rect x="160" y="690" width="120" height="140"/>
    <rect x="300" y="620" width="170" height="210"/>
    <rect x="490" y="700" width="130" height="130"/>
    <rect x="640" y="600" width="150" height="230"/>
    <rect x="810" y="680" width="120" height="150"/>
    <rect x="950" y="590" width="165" height="240"/>
    <rect x="1135" y="665" width="130" height="165"/>
    <rect x="1285" y="580" width="150" height="250"/>
    <rect x="1455" y="670" width="125" height="160"/>
    <rect x="1600" y="610" width="175" height="220"/>
    <rect x="1795" y="680" width="145" height="150"/>
  </g>
  <g fill="url(#winA)">
    <rect x="300" y="620" width="170" height="210"/>
    <rect x="640" y="600" width="150" height="230"/>
    <rect x="950" y="590" width="165" height="240"/>
    <rect x="1285" y="580" width="150" height="250"/>
    <rect x="1600" y="610" width="175" height="220"/>
  </g>

  <!-- мост -->
  <g fill="#150d08">
    <rect x="0" y="800" width="1920" height="14"/>
    <rect x="180" y="814" width="22" height="60"/>
    <rect x="520" y="814" width="22" height="60"/>
    <rect x="860" y="814" width="22" height="60"/>
    <rect x="1200" y="814" width="22" height="60"/>
    <rect x="1540" y="814" width="22" height="60"/>
  </g>
  <g fill="#ffb26b" opacity="0.8">
    <circle cx="120" cy="800" r="4"/><circle cx="330" cy="800" r="4"/>
    <circle cx="540" cy="800" r="4"/><circle cx="750" cy="800" r="4"/>
    <circle cx="960" cy="800" r="4"/><circle cx="1170" cy="800" r="4"/>
    <circle cx="1380" cy="800" r="4"/><circle cx="1590" cy="800" r="4"/>
    <circle cx="1800" cy="800" r="4"/>
  </g>

  <!-- вода -->
  <rect x="0" y="826" width="1920" height="254" fill="url(#water)"/>
  <rect x="960" y="826" width="420" height="254" fill="url(#reflection)"/>
  <g stroke="#ff9440" stroke-linecap="round" opacity="0.35">
    <line x1="1010" y1="850" x2="1330" y2="850" stroke-width="3"/>
    <line x1="1060" y1="880" x2="1290" y2="880" stroke-width="2"/>
    <line x1="990" y1="912" x2="1350" y2="912" stroke-width="3"/>
    <line x1="1080" y1="948" x2="1270" y2="948" stroke-width="2"/>
    <line x1="1030" y1="985" x2="1310" y2="985" stroke-width="3"/>
    <line x1="1100" y1="1024" x2="1250" y2="1024" stroke-width="2"/>
  </g>
  <g stroke="#ffb26b" stroke-linecap="round" opacity="0.25">
    <line x1="120" y1="860" x2="420" y2="860" stroke-width="2"/>
    <line x1="1500" y1="900" x2="1820" y2="900" stroke-width="2"/>
    <line x1="60" y1="960" x2="500" y2="960" stroke-width="2"/>
    <line x1="1420" y1="1000" x2="1880" y2="1000" stroke-width="2"/>
  </g>

  <!-- вертолёт -->
  <g fill="#0a0705" transform="translate(1590,120) scale(1.1)">
    <rect x="0" y="10" width="54" height="20" rx="9"/>
    <rect x="44" y="14" width="34" height="8" rx="4"/>
    <rect x="72" y="6" width="7" height="16" rx="3"/>
    <rect x="-14" y="4" width="82" height="4" rx="2"/>
    <rect x="24" y="-6" width="6" height="12"/>
    <rect x="6" y="30" width="12" height="4"/>
    <rect x="34" y="30" width="12" height="4"/>
  </g>

  <!-- ближние здания по краям (кадрирование) -->
  <g fill="url(#near)">
    <rect x="-40" y="380" width="230" height="460"/>
    <rect x="1740" y="440" width="230" height="400"/>
  </g>
  <g fill="url(#winC)">
    <rect x="-40" y="380" width="230" height="460"/>
    <rect x="1740" y="440" width="230" height="400"/>
  </g>

  <!-- КРЫША (передний план) -->
  <g fill="#0a0705">
    <polygon points="0,900 1920,760 1920,1080 0,1080"/>
    <polygon points="0,884 1920,744 1920,772 0,912"/>
  </g>
  <g fill="#141009" opacity="0.9">
    <polygon points="0,916 1920,776 1920,790 0,930"/>
  </g>
  <!-- вентиляция и мусор на крыше -->
  <g fill="#0d0a06">
    <rect x="120" y="930" width="90" height="70" rx="6"/>
    <rect x="150" y="905" width="30" height="30" rx="4"/>
    <rect x="1560" y="880" width="70" height="56" rx="6"/>
    <rect x="1680" y="950" width="110" height="80" rx="8"/>
  </g>

  <!-- дым/туман -->
  <ellipse cx="1170" cy="770" rx="520" ry="60" fill="#ff8a30" opacity="0.10" filter="url(#blur60)"/>
  <ellipse cx="300" cy="800" rx="380" ry="50" fill="#ff8a30" opacity="0.07" filter="url(#blur60)"/>

  <!-- виньетка -->
  <rect width="1920" height="1080" fill="url(#sunGlow)" opacity="0"/>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.62"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
